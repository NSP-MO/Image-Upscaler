name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Dependencies
        run: dotnet restore image-upscaler.csproj -r win-x64 -p:Configuration=Release

      - name: Build Project
        run: dotnet build image-upscaler.csproj -c Release -r win-x64 --no-restore

      - name: Publish Standalone Single-File Executable
        run: dotnet publish image-upscaler.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Prepare Release Executable Artifact
        shell: powershell
        run: |
          $refName = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "latest" }
          $exeName = "ImageUpscaler-${refName}-win-x64.exe"
          Copy-Item -Path "./publish/ImageUpscaler.exe" -Destination "./${exeName}" -Force
          Write-Host "Created single-file executable artifact: ${exeName}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageUpscaler-Executable
          path: ImageUpscaler-*-win-x64.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ImageUpscaler-*-win-x64.exe
            requirements.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
