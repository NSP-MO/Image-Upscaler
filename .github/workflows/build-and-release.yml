name: Build & Release Image Upscaler

'on':
  release:
    types: [published, created]
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Self-Contained Installers & Portable Package
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies (win-x64)
        run: dotnet restore image-upscaler.csproj -r win-x64

      - name: Publish Self-Contained Windows x64 Package
        run: >
          dotnet publish image-upscaler.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o ./publish
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Verify & Copy Runtime Assets to Publish Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./publish/models"
          Get-ChildItem -Path "./models" -Filter "*.py" | Copy-Item -Destination "./publish/models" -Force
          if (Test-Path "./requirements.txt") { Copy-Item -Path "./requirements.txt" -Destination "./publish" -Force }
          if (Test-Path "./license.rtf") { Copy-Item -Path "./license.rtf" -Destination "./publish" -Force }
          Write-Host "Publish folder contents:"
          Get-ChildItem -Path "./publish" -Recurse | Select-Object FullName

      - name: Install WiX Toolset v4 & UI Extension
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add --global WixToolset.UI.wixext/4.0.6

      - name: Setup Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Inno Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "./installer/output"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/ImageUpscaler_Setup.iss

      - name: Build WiX MSI Installer (.msi)
        shell: pwsh
        run: |
          wix build installer/ImageUpscaler_Setup.wxs -ext WixToolset.UI.wixext -o installer/output/ImageUpscaler_Setup_v0.3.1_x64.msi

      - name: Create Portable Zip Package (.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath ./installer/output/ImageUpscaler_Portable_v0.3.1_x64.zip -Force

      - name: List & Verify Final Packages
        shell: pwsh
        run: |
          if (Test-Path "./installer/output/*.wixpdb") { Remove-Item "./installer/output/*.wixpdb" -Force }
          Write-Host "=== Final Packages in installer/output/ ==="
          Get-ChildItem -Path "./installer/output" | ForEach-Object {
            $sizeMb = [Math]::Round($_.Length / 1MB, 2)
            Write-Host " - $($_.Name): $sizeMb MB"
          }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImageUpscaler-v0.3.1-Windows-x64
          path: installer/output/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/*
          name: Image Upscaler ${{ github.ref_name || github.event.release.tag_name }}
          tag_name: ${{ github.ref_name || github.event.release.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
